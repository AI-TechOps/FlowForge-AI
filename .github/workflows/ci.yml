name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge_scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Scratch DB for the migration upgrade→downgrade→upgrade gate; the
      # runner script refuses any database whose name lacks a scratch marker.
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge_scratch
      # Required by app settings at import time (seed-script gate); nothing
      # in the test job actually connects to Redis.
      REDIS_URL: redis://localhost:6379/0
      # Phase 1 gates embed without Ollama via the deterministic fake
      # provider (D15). Refused when APP_ENV=prod; CI runs as dev.
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Runtime isolation guard (D6)
        run: python scripts/check_runtime_isolation.py

      - name: Run tests
        run: pytest --tb=short

  integration:
    name: phase1-and-phase2-gates
    runs-on: ubuntu-latest
    # G1.1–G1.4 and G2.1–G2.6 are HTTP integration gates: they need the full
    # stack (db+pgvector, redis, backend, worker), and G1.4 kills/restarts the
    # real worker container. The fast `test` job only has Postgres, so the live
    # gates skip there — this job actually exercises ingestion, retrieval, and
    # triage.
    env:
      # Compose re-interpolates ${LLM_PROVIDER}/${APP_ENV} on every invocation,
      # including the worker restart the killed-worker test drives, so they must
      # live in the process env (D15: fake embeddings, refused in prod).
      LLM_PROVIDER: fake
      APP_ENV: dev
      # Phase 2 gates flip this per-test to prove the schema/enum/grounding
      # gates fail closed (D16 decision 3); `valid` is the default path.
      FAKE_LLM_MODE: valid
      COMPOSE_FILE: infra/docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # tests/phase1 talks to the stack over HTTP and seeds orgs via asyncpg;
      # it never imports app/, so the runner only needs pytest + asyncpg.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Build and start the stack
        run: docker compose -f "$COMPOSE_FILE" up -d --build db redis backend worker

      - name: Wait for backend health
        run: |
          for _ in $(seq 1 60); do
            if curl -sf localhost:8000/api/health | grep -q '"status":"ok"'; then
              echo "backend healthy"; exit 0
            fi
            sleep 3
          done
          echo "backend did not become healthy in time"
          docker compose -f "$COMPOSE_FILE" logs --tail=120 backend worker
          exit 1

      - name: Run migrations
        run: docker compose -f "$COMPOSE_FILE" exec -T backend alembic upgrade head

      - name: Seed demo org and eval tickets
        env:
          DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          REDIS_URL: redis://localhost:6379/0
        run: |
          python scripts/seed.py
          python scripts/load_eval_tickets.py

      - name: Run Phase 1 gates (G1.1–G1.4)
        env:
          PHASE1_REQUIRE_LIVE: "1"
          PHASE1_MANAGE_WORKER: "1"
          PHASE1_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          PHASE1_COMPOSE_FILE: ${{ github.workspace }}/infra/docker-compose.yml
          PHASE1_BASE_URL: http://localhost:8000
        run: pytest tests/phase1 -v --tb=short

      # Phase 2 gate tests are Codex's task 10; this step runs them once they
      # land and is a no-op (exit 5 = nothing collected) until then.
      - name: Run Phase 2 gates (G2.1–G2.6)
        env:
          PHASE2_REQUIRE_LIVE: "1"
          PHASE2_MANAGE_WORKER: "1"
          PHASE2_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          PHASE2_COMPOSE_FILE: ${{ github.workspace }}/infra/docker-compose.yml
          PHASE2_BASE_URL: http://localhost:8000
        run: |
          if [ ! -d tests/phase2 ]; then
            echo 'Phase 2 gate tests not landed yet (Codex task 10).'
            exit 0
          fi
          pytest tests/phase2 -v --tb=short

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action requires a GITLEAKS_LICENSE key for org-owned repos,
      # so run the CLI directly instead.
      - name: Scan for committed secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact .
