# Serves the built SPA and proxies /api to the backend.
#
# Processed as a template at container start (nginx:alpine's entrypoint
# substitutes ${API_PROXY_TARGET}), so the same image runs against compose's
# `backend` service and against whatever Phase 7 deploys to.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its routes. Any path that is not a real file falls through
    # to index.html so a deep link like /runs/<uuid> survives a page refresh —
    # without this, React Router only works when you navigate from within.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable by construction, so they can be
    # cached hard. index.html must never be, or a deploy ships new assets that
    # nobody's browser asks for.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass ${API_PROXY_TARGET};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Document upload: the backend accepts files well past nginx's 1 MB
        # default, and hitting that default surfaces as a confusing 413 rather
        # than the validation message the API would have given.
        client_max_body_size 25m;

        # An eval batch or a slow model call can outlast the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # woff2 is already compressed; gzipping it again costs CPU for nothing.

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
