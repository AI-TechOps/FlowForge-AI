name: flowforge

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@db:5432/flowforge
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      APP_ENV: ${APP_ENV:-dev}
      # Identity provider (D18). "local" is an offline issuer for dev/CI and is
      # refused when APP_ENV=prod; set AUTH_PROVIDER=auth0 with a real tenant.
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-flowforge-api}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-llama3.1:8b}
      # The eval judge (D19 decision 1). Settings refuse a judge equal to
      # TRIAGE_MODEL, so overriding one without the other fails at startup
      # rather than producing a batch that graded its own output.
      JUDGE_MODEL: ${JUDGE_MODEL:-qwen2.5:7b}
      FAKE_LLM_MODE: ${FAKE_LLM_MODE:-valid}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # The eval answer key. Mounted read-only rather than baked into the
      # image: fixtures/ is a dev-time artifact outside the backend build
      # context (D6), and the labels must stay out of the database so the
      # agent cannot read the answers it is scored against.
      EVAL_LABELS_PATH: /srv/fixtures/eval_tickets.json
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
      - ../fixtures:/srv/fixtures:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ../backend
    command: ["arq", "app.worker.WorkerSettings"]
    # arq exits when it loses Redis. Without a restart policy the worker
    # stays dead after a blip and nothing processes runs again — the
    # background half of the system silently disappears.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@db:5432/flowforge
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      APP_ENV: ${APP_ENV:-dev}
      # Identity provider (D18). "local" is an offline issuer for dev/CI and is
      # refused when APP_ENV=prod; set AUTH_PROVIDER=auth0 with a real tenant.
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-flowforge-api}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-llama3.1:8b}
      # The eval judge (D19 decision 1). Settings refuse a judge equal to
      # TRIAGE_MODEL, so overriding one without the other fails at startup
      # rather than producing a batch that graded its own output.
      JUDGE_MODEL: ${JUDGE_MODEL:-qwen2.5:7b}
      FAKE_LLM_MODE: ${FAKE_LLM_MODE:-valid}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # The eval answer key. Mounted read-only rather than baked into the
      # image: fixtures/ is a dev-time artifact outside the backend build
      # context (D6), and the labels must stay out of the database so the
      # agent cannot read the answers it is scored against.
      EVAL_LABELS_PATH: /srv/fixtures/eval_tickets.json
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
      - ../fixtures:/srv/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      # Auth0 settings are compiled into the bundle, so they are build args
      # rather than runtime env (see frontend/src/auth.ts for why the SPA does
      # not fetch them). Absent means the local dev issuer.
      args:
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
    environment:
      # Runtime, and the only thing that is: nginx substitutes it at boot, so
      # the same image points at a different backend without a rebuild.
      API_PROXY_TARGET: http://backend:8000
    ports:
      # nginx serves on 80 inside the container; 5173 stays the host port so
      # every existing note and bookmark still works (D21 decision 7).
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads:
