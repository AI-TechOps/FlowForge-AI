[project]
name = "flowforge-backend"
version = "0.1.0"
description = "FlowForge-AI backend — FastAPI + LangGraph agents over Postgres/pgvector and Redis."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2,<7",
    "pgvector>=0.3",
    "httpx>=0.28",
    "arq>=0.26",
    # arq pulls redis[hiredis]; hiredis 3.4.1's arm64 wheel SIGILLs on import,
    # which takes the backend and worker down with exit 132 and no log line at
    # all. Same failure mode as the redis/pyjwt wheels noted below, measured on
    # an Apple Silicon dev machine: 2.3.2 through 3.4.0 import fine, 3.4.1 does
    # not. Excluded rather than capped so a fixed 3.4.2 is picked up.
    "hiredis>=3.1,!=3.4.1,<4",
    "python-multipart>=0.0.18",
    "pypdf>=5.1",
    # Upper bounds because unpinned ranges have already bitten: a newer
    # checkpoint-postgres shipped migration v6, whose setup() race surfaced as
    # seven unrelated Phase 2 gate failures, and unpinned ARM wheels for redis
    # and pyjwt resolved to builds that SIGILL on import.
    "langgraph>=1.0,<2",
    # Requires psycopg3 while the app runs on asyncpg (D16 decision 5):
    # two drivers, deliberately — the checkpointer is not the place for a
    # bespoke persistence layer.
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary,pool]>=3.2",
    # JWT verification (Phase 4). The [crypto] extra pulls in `cryptography`,
    # which the local dev issuer also uses to generate its keypair.
    "pyjwt[crypto]>=2.10,<3",
    # Capped for the same reason as the wheels above: cryptography 47+ ships an
    # arm64 `_rust` extension that SIGILLs on import on an Apple Silicon dev
    # machine, taking down backend and worker with exit 132 and no log line.
    # Measured: 43.0.3-46.0.4 import fine, 47.0.0 and later do not. The crash
    # reaches everything, because redis, pyjwt and pypdf all import it.
    "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses these calls as defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
