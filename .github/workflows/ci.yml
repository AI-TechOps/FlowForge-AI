name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge_scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Scratch DB for the migration upgrade→downgrade→upgrade gate; the
      # runner script refuses any database whose name lacks a scratch marker.
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge_scratch
      # Both are required by app settings at import time: app/db.py builds the
      # engine on import, so any test that imports app/ needs them present even
      # though nothing in this job connects to Postgres-via-app or to Redis.
      DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge_scratch
      REDIS_URL: redis://localhost:6379/0
      # Phase 1 gates embed without Ollama via the deterministic fake
      # provider (D15). Refused when APP_ENV=prod; CI runs as dev.
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Runtime isolation guard (D6)
        run: python scripts/check_runtime_isolation.py

      # D18 decision 7: the automated half of tenant scoping. Review alone has
      # already missed two cross-tenant reads (Codex Phase 3 F6, Phase 4 F1).
      - name: Tenant scoping guard (D18)
        run: python scripts/check_tenant_scoping.py

      - name: Run tests
        run: pytest --tb=short

  integration:
    # Named for what it runs, which is now every live gate G1.1-G5.5 plus the
    # adversarial probes — not the two phases it started life covering. A stale
    # job name is a check nobody reads correctly when it goes red.
    name: live-gates-and-adversarial
    runs-on: ubuntu-latest
    # G1.1–G1.4 and G2.1–G2.6 are HTTP integration gates: they need the full
    # stack (db+pgvector, redis, backend, worker), and G1.4 kills/restarts the
    # real worker container. The fast `test` job only has Postgres, so the live
    # gates skip there — this job actually exercises ingestion, retrieval, and
    # triage.
    env:
      # Compose re-interpolates ${LLM_PROVIDER}/${APP_ENV} on every invocation,
      # including the worker restart the killed-worker test drives, so they must
      # live in the process env (D15: fake embeddings, refused in prod).
      LLM_PROVIDER: fake
      APP_ENV: dev
      # Phase 2 gates flip this per-test to prove the schema/enum/grounding
      # gates fail closed (D16 decision 3); `valid` is the default path.
      FAKE_LLM_MODE: valid
      COMPOSE_FILE: infra/docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # tests/phase1 talks to the stack over HTTP and seeds orgs via asyncpg;
      # it never imports app/, so the runner only needs pytest + asyncpg.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Build and start the stack
        run: docker compose -f "$COMPOSE_FILE" up -d --build db redis backend worker

      - name: Wait for backend health
        run: |
          for _ in $(seq 1 60); do
            if curl -sf localhost:8000/api/health | grep -q '"status":"ok"'; then
              echo "backend healthy"; exit 0
            fi
            sleep 3
          done
          echo "backend did not become healthy in time"
          docker compose -f "$COMPOSE_FILE" logs --tail=120 backend worker
          exit 1

      - name: Run migrations
        run: docker compose -f "$COMPOSE_FILE" exec -T backend alembic upgrade head

      - name: Seed demo org and eval tickets
        env:
          DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          REDIS_URL: redis://localhost:6379/0
        run: |
          python scripts/seed.py
          python scripts/load_eval_tickets.py

      - name: Run Phase 1 gates (G1.1–G1.4)
        env:
          PHASE1_REQUIRE_LIVE: "1"
          PHASE1_MANAGE_WORKER: "1"
          PHASE1_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          PHASE1_COMPOSE_FILE: ${{ github.workspace }}/infra/docker-compose.yml
          PHASE1_BASE_URL: http://localhost:8000
          # Any gate that imports app/ needs these: app/db.py builds the
          # engine at import time. The Phase 2 taxonomy parity test does.
          DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/phase1 -v --tb=short

      # G2.4 (seed-set accuracy) skips here by design: it is opt-in via
      # PHASE2_RUN_EVAL and refuses to score the fake provider, whose accuracy
      # is noise. It is measured against a real model and recorded in
      # eval/baseline.md.
      - name: Run Phase 2 gates (G2.1–G2.6)
        env:
          PHASE2_REQUIRE_LIVE: "1"
          PHASE2_MANAGE_WORKER: "1"
          PHASE2_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          PHASE2_COMPOSE_FILE: ${{ github.workspace }}/infra/docker-compose.yml
          PHASE2_BASE_URL: http://localhost:8000
          # Any gate that imports app/ needs these: app/db.py builds the
          # engine at import time. The Phase 2 taxonomy parity test does.
          DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/phase2 -v --tb=short

      # PHASE3_MANAGE_BACKEND lets G3.1 restart the backend mid-pause. Without
      # it that test skips — and a skipped durability gate protects nothing,
      # since the durable pause is the whole point of this phase.
      - name: Run Phase 3 gates (G3.1-G3.7)
        env:
          PHASE3_REQUIRE_LIVE: "1"
          PHASE3_MANAGE_STACK: "1"
          PHASE3_MANAGE_BACKEND: "1"
          PHASE3_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          PHASE3_COMPOSE_FILE: ${{ github.workspace }}/infra/docker-compose.yml
          PHASE3_BASE_URL: http://localhost:8000
          DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/phase3 -v --tb=short

      # G4.1-G4.6. These seed their own two organizations with a full set of
      # principals in each, and mint tokens through the local dev issuer --
      # which exercises the same verification path Auth0 would, so no tenant is
      # needed here (D18 decision 1).
      - name: Run Phase 4 gates (G4.1-G4.6)
        env:
          PHASE4_REQUIRE_LIVE: "1"
          PHASE4_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          PHASE4_BASE_URL: http://localhost:8000
          DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/phase4 -v --tb=short

      # G5.1-G5.5. The pure halves (scoring determinism, judge schema, config
      # validation, eval-graph shape) already ran in the fast job; here they
      # run again alongside the live halves that need the worker -- metric
      # truth against a hand-computed dataset, batch coverage, comparability.
      #
      # G5.2's canary pair stays skipped: it needs a real judge model, and this
      # stack is the fake provider, which is semantically blind (D19 decision
      # 3). It is measured against Ollama and recorded in eval/baseline.md.
      - name: Run Phase 5 gates (G5.1-G5.5)
        env:
          PHASE5_REQUIRE_LIVE: "1"
          PHASE5_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          PHASE5_BASE_URL: http://localhost:8000
          # A fake-provider batch is seconds of work, but the batch also waits
          # for its runs to settle; keep the ceiling well above that.
          PHASE5_BATCH_TIMEOUT_SECONDS: "300"
          DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/phase5 -v --tb=short

      # Codex's adversarial probes. Several drive the live stack (credential
      # handling, cross-tenant run detail, rollback behaviour), so they belong
      # here rather than in the Postgres-only fast job.
      - name: Run adversarial probes
        env:
          PHASE2_REQUIRE_LIVE: "1"
          PHASE2_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          PHASE2_BASE_URL: http://localhost:8000
          # Phase 3 and 4 probes need their own live flags, or they skip
          # silently when the stack is missing — a probe that quietly does not
          # run is worse than no probe, because the report says it passed.
          PHASE3_REQUIRE_LIVE: "1"
          PHASE3_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          PHASE3_BASE_URL: http://localhost:8000
          PHASE3_COMPOSE_FILE: ${{ github.workspace }}/infra/docker-compose.yml
          PHASE4_REQUIRE_LIVE: "1"
          PHASE4_DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          PHASE4_BASE_URL: http://localhost:8000
          # Several probes import app/ directly (audit scrubber, tool clamping,
          # transport retry). app/db.py constructs the engine at import time, so
          # settings must resolve even for probes that never open a connection.
          DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@localhost:5432/flowforge
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/adversarial -v --tb=short

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action requires a GITLEAKS_LICENSE key for org-owned repos,
      # so run the CLI directly instead.
      - name: Scan for committed secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          # --config is explicit: .gitleaks.toml allowlists the synthetic
          # credential markers the adversarial probes must contain.
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .
