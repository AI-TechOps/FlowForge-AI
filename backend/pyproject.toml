[project]
name = "flowforge-backend"
version = "0.1.0"
description = "FlowForge-AI backend — FastAPI + LangGraph agents over Postgres/pgvector and Redis."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pgvector>=0.3",
    "httpx>=0.28",
    "arq>=0.26",
    "python-multipart>=0.0.18",
    "pypdf>=5.1",
    "langgraph>=1.0",
    # Requires psycopg3 while the app runs on asyncpg (D16 decision 5):
    # two drivers, deliberately — the checkpointer is not the place for a
    # bespoke persistence layer.
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses these calls as defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
